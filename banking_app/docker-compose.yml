services:
  postgres:
    image: postgres:17
    container_name: bankingdb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: bankingdb
    volumes:
      - bankingdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bankingdb"]

volumes:
  bankingdb_data:
