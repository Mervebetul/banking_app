<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banking App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Banking App</div>
  <div class="topbar-right">
    <span class="demo-tag">Showcase mode</span>
    <button class="btn ghost" disabled title="Coming soon">Log in</button>
    <button class="btn ghost" disabled title="Coming soon">Enroll</button>
  </div>
</header>

<main class="container">

  <section class="hero card">
    <div class="hero-left">
      <div class="label">Account holder</div>
      <div class="holder" id="holder">-</div>
      <div class="muted" id="email">-</div>
      <div class="iban-row">
        <span class="label">IBAN</span>
        <span class="iban" id="iban">-</span>
      </div>
    </div>
    <div class="hero-right">
      <div class="label">Available balance</div>
      <div class="balance" id="balance">-</div>
      <div class="muted">Showing account:
        <select id="accountSelect"></select>
      </div>
    </div>
  </section>

  <section class="grid">
    <div class="card">
      <h2>Card &amp; limits</h2>
      <div class="row"><span>Card type</span><strong id="cardType">-</strong></div>
      <div class="row"><span>Spending limit</span><strong id="limit">-</strong></div>
      <div class="row-actions">
        <button class="btn ghost" disabled title="Not available in showcase">Change limit</button>
        <button class="btn ghost" disabled title="Not available in showcase">Card settings</button>
        <button class="btn ghost" disabled title="Not available in showcase">Edit profile</button>
      </div>
    </div>

    <div class="card">
      <h2>Transfer money</h2>
      <form id="transferForm">
        <label>To account
          <select id="toAccount" required></select>
        </label>
        <label>Amount
          <input type="number" id="transferAmount" min="0.01" step="0.01" placeholder="0.00" required>
        </label>
        <button class="btn primary" type="submit">Send</button>
        <div class="msg" id="transferMsg"></div>
      </form>
    </div>

    <div class="card">
      <h2>Pay in installments</h2>
      <form id="planForm">
        <label>Total purchase
          <input type="number" id="planTotal" min="1" step="0.01" placeholder="0.00" required>
        </label>
        <label>Split into
          <select id="planCount">
            <option value="3">3 payments</option>
            <option value="6">6 payments</option>
            <option value="9">9 payments</option>
            <option value="12">12 payments</option>
          </select>
        </label>
        <button class="btn primary" type="submit">Start plan</button>
        <div class="msg" id="planMsg"></div>
      </form>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Installment plans</h2>
      <button class="btn ghost" id="advanceBtn" title="Demo: pretend 30 days passed">Simulate +30 days</button>
    </div>
    <div id="plans" class="muted">No plans yet.</div>
  </section>

  <section class="card">
    <h2>Transaction history</h2>
    <table>
      <thead><tr><th>Date</th><th>Type</th><th>Details</th><th class="num">Amount</th><th class="num">Balance after</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
